name: Build AAB (release)

# Só roda a pedido: gera o pacote de produção assinado com a chave de upload da Play Store.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir se os secrets da chave estão cadastrados
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltando=""
          [ -z "$KEYSTORE_BASE64" ] && faltando="$faltando KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && faltando="$faltando STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && faltando="$faltando KEY_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error::Faltam secrets:$faltando. Veja docs/play/publicacao.md."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restaurar a chave de upload
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Gerar o AAB assinado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle bundleRelease --stacktrace

      - name: Conferir que o pacote saiu assinado
        run: |
          aab=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$aab" ]; then
            echo "::error::Nenhum .aab foi gerado."
            exit 1
          fi
          echo "Pacote: $aab ($(du -h "$aab" | cut -f1))"
          # Um AAB assinado carrega os arquivos de assinatura no META-INF.
          if unzip -l "$aab" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "Assinatura encontrada."
          else
            echo "::error::O .aab saiu sem assinatura. Confira os secrets da chave."
            exit 1
          fi

      - name: Apagar a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      # Artefato privado do Actions, e não release pública: este é o pacote de produção.
      - name: Publicar o AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: guardiao-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
