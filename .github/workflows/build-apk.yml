name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # The debug signing config points at ./debug.keystore, which is
      # gitignored, so it must be generated before every build.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardiao-de-arquivos-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Artefatos de build só podem ser baixados por quem está logado no GitHub, e o app do
      # GitHub no celular nem os exibe. O release resolve isso: link direto para o .apk, sem
      # login e sem zip. A tag "latest" fica fixa e o arquivo é substituído a cada build.
      - name: Publicar o APK no release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk guardiao.apk
          versao=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          notas="Versão ${versao} — APK de debug do commit ${GITHUB_SHA:0:7}, gerado automaticamente pelo build."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest guardiao.apk --clobber
            gh release edit latest --notes "$notas"
          else
            gh release create latest guardiao.apk \
              --title "Guardião de Arquivos — último build" \
              --notes "$notas"
          fi
